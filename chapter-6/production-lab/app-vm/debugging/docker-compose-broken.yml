version: '3.3'

services:
  app:
    build: .
    container_name: flask-app-broken
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=production
    networks:
      - app_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus-broken
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9091:9090"
    volumes:
      - ../prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring_network
    restart: unless-stopped
    # PROBLEM: Containers are on DIFFERENT networks - they can't communicate!

networks:
  app_network:
    driver: bridge
  monitoring_network:
    driver: bridge