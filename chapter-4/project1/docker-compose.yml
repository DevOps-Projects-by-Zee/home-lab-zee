version: '3.3'

services:
  web1:
    image: nginx:alpine
    volumes:
      - ./html:/usr/share/nginx/html
  
  web2:
    image: nginx:alpine
    volumes:
      - ./html:/usr/share/nginx/html
  
  web3:
    image: nginx:alpine
    volumes:
      - ./html:/usr/share/nginx/html
  
  loadbalancer:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web1
      - web2
      - web3

# If you are running Docker inside VirtualBox or on Windows 11 with Docker Desktop, some files mounted from your host may not refresh inside containers. This can cause ${HOSTNAME} to display literally.
